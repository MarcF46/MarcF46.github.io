iddle" x="700.0" y="830">Befund belegen statt vermuten</text><text fill="#567080" font-family="Arial, DejaVu Sans, sans-serif" font-size="19" text-anchor="middle" x="700.0" y="860">Messwert + Zeitpunkt + Prozess / Dienst / Systembezug</text><path d="M700,886 V915" fill="none" marker-end="url(#arrow)" stroke="#18868e" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><rect fill="#f1faf6" height="86" rx="18" ry="18" stroke="#4c9c81" stroke-width="2.2" width="620" x="390" y="916" /><text fill="#1a3446" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" font-weight="bold" text-anchor="middle" x="700.0" y="950">Gezielt beheben und Erfolg prüfen</text><text fill="#567080" font-family="Arial, DejaVu Sans, sans-serif" font-size="19" text-anchor="middle" x="700.0" y="980">Gleiche Benutzeraktion unter vergleichbaren Bedingungen testen</text><text fill="#ab5427" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" x="700" y="1040">Kein blindes Beenden von Diensten, Löschen von Dateien oder Ausführen von „Cleanern“.</text></svg>