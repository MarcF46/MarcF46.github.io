xt><text fill="#567080" font-family="Arial, DejaVu Sans, sans-serif" font-size="19" text-anchor="middle" x="355.0" y="536">Task-Manager · resmon.exe · perfmon.exe /rel</text><text fill="#567080" font-family="Arial, DejaVu Sans, sans-serif" font-size="19" text-anchor="middle" x="355.0" y="562">Zeitverlauf + Prozessbezug dokumentieren</text><rect fill="#ffffff" height="106" rx="18" ry="18" stroke="#b2d6e4" stroke-width="2.2" width="580" x="755" y="472" /><text fill="#1a3446" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" x="1045.0" y="506">Zentralen Vorfall prüfen / eskalieren</text><text fill="#567080" font-family="Arial, DejaVu Sans, sans-serif" font-size="19" text-anchor="middle" x="1045.0" y="536">Weitere Geräte und Änderungszeitpunkte vergleichen</text><text fill="#567080" font-family="Arial, DejaVu Sans, sans-serif" font-size="19" text-anchor="middle" x="1045.0" y="562">Störungen des IT-Betriebs abgleichen</text><path d="M355,578 V603" fill="none" stroke="#18868e" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><line stroke="#18868e" stroke-width="3" x1="125" x2="575" y1="603" y2="603" /><path d="M130,603 V625" fill="none" marker-end="url(#arrow)" stroke="#18868e" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><path d="M275,603 V625" fill="none" marker-end="url(#arrow)" stroke="#18868e" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><path d="M420,603 V625" fill="none" marker-end="url(#arrow)" stroke="#18868e" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><path d="M565,603 V625" fill="none" marker-end="url(#arrow)" stroke="#18868e" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><rect fill="#edf9f6" height="92" rx="18" ry="18" stroke="#7abec1" stroke-width="2.2" width="145" x="70" y="627" /><text fill="#1a3446" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" x="142.5"