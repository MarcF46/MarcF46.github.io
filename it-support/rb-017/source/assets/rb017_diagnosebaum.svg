<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100" role="img" aria-labelledby="title desc">
<title id="title">RB-017 Netzlaufwerk: technischer Diagnose-Entscheidungsbaum</title>
<desc id="desc">Netzlaufwerk prüfen, UNC-Pfad direkt testen, bei fehlendem Mapping Gruppenrichtlinie, bei unerreichbarer Freigabe Netzwerk und SMB oder bei Zugriff verweigert Berechtigungen prüfen, anschließend gezielt beheben und testen.</desc>
<defs><linearGradient id="navy" x2="1" y2="1"><stop stop-color="#10243e"/><stop offset="1" stop-color="#173e5a"/></linearGradient><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="none" stroke="#4c7f92" stroke-width="1.7"/></marker></defs>
<rect width="1200" height="1100" fill="#f5fafc"/>
<rect x="26" y="24" width="1148" height="102" rx="18" fill="url(#navy)"/>
<text x="600" y="73" text-anchor="middle" fill="#fff" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">RB-017 – Netzlaufwerk fehlt / nicht erreichbar</text>
<text x="600" y="103" text-anchor="middle" fill="#a5e8e4" font-family="DejaVu Sans,Arial,sans-serif" font-size="17">Erst zuordnen · dann Verbindung · dann Berechtigung beurteilen</text>

<rect x="330" y="160" width="540" height="84" rx="14" fill="#e5f5f6" stroke="#3b929c" stroke-width="1.8"/>
<text x="600" y="193" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="bold" fill="#162d40" text-anchor="middle">Fehlermeldung und Benutzerkontext erfassen</text>
<text x="600" y="220" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="normal" fill="#162d40" text-anchor="middle">Z: fehlt? Rotes X? UNC-Zugriff verweigert?</text>
<path d="M600,244 L600,281" stroke="#4c7f92" stroke-width="2.5" fill="none" marker-end="url(#arr)" />
<rect x="340" y="282" width="520" height="100" rx="14" fill="#fff" stroke="#568ea0" stroke-width="1.8"/>
<text x="600" y="316" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="bold" fill="#162d40" text-anchor="middle">UNC-Pfad direkt testen</text>
<text x="600" y="344" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" fill="#162d40" text-anchor="middle">\\FS01\Projekte  im Explorer öffnen</text>
<text x="600" y="365" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" fill="#547080" text-anchor="middle">Welche konkrete Rückmeldung?</text>
<path d="M600,382 V420 M600,420 H207 V463 M600,420 V463 M600,420 H993 V463" stroke="#4c7f92" stroke-width="2.4" fill="none"/>
<rect x="53" y="400" width="308" height="45" rx="22" fill="#fff" stroke="#d1e3e9" stroke-width="1"/>
<text x="207" y="428" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="bold" fill="#1a6473" text-anchor="middle">UNC funktioniert</text>
<rect x="446" y="400" width="308" height="45" rx="22" fill="#fff" stroke="#d1e3e9" stroke-width="1"/>
<text x="600" y="428" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="bold" fill="#1a6473" text-anchor="middle">UNC nicht erreichbar</text>
<rect x="839" y="400" width="308" height="45" rx="22" fill="#fff" stroke="#d1e3e9" stroke-width="1"/>
<text x="993" y="428" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="bold" fill="#1a6473" text-anchor="middle">Zugriff verweigert</text>
<rect x="33" y="468" width="348" height="196" rx="14" fill="#e7f8ed" stroke="#49a675" stroke-width="1.8"/>
<text x="207" y="504" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="bold" fill="#176341" text-anchor="middle">A · Zuordnung / GPO</text>
<text x="207" y="537" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" fill="#194836" text-anchor="middle">Z: im Benutzerkontext vorhanden?</text>
<text x="207" y="562" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" fill="#194836" text-anchor="middle">Get-SmbMapping · net use</text>
<text x="207" y="587" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" fill="#194836" text-anchor="middle">gpresult /scope user /r</text>
<text x="207" y="612" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" fill="#194836" text-anchor="middle">Drive Maps · Zielgruppenfilter</text>
<text x="207" y="637" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" fill="#194836" text-anchor="middle">UAC-Kontext / Anmeldeskript</text>
<rect x="426" y="468" width="348" height="196" rx="14" fill="#e8f1fe" stroke="#4688c3" stroke-width="1.8"/>
<text x="600" y="504" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="bold" fill="#235580" text-anchor="middle">B · Netzwerk / SMB</text>
<text x="600" y="537" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1b4d74" text-anchor="middle">DNS-Auflösung: FS01</text>
<text x="600" y="562" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1b4d74" text-anchor="middle">VPN · Route · Gateway</text>
<text x="600" y="587" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1b4d74" text-anchor="middle">TCP-Port 445 erreichbar?</text>
<text x="600" y="612" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1b4d74" text-anchor="middle">Server / Freigabename prüfen</text>
<text x="600" y="637" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" fill="#1b4d74" text-anchor="middle">Nicht nur auf Ping verlassen</text>
<rect x="819" y="468" width="348" height="196" rx="14" fill="#fff4e5" stroke="#d99a36" stroke-width="1.8"/>
<text x="993" y="504" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="bold" fill="#8a5717" text-anchor="middle">C · Zugriff / Rechte</text>
<text x="993" y="537" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" fill="#70501c" text-anchor="middle">Richtige Identität / Gruppen?</text>
<text x="993" y="562" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" fill="#70501c" text-anchor="middle">SMB-Freigabeberechtigung</text>
<text x="993" y="587" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" fill="#70501c" text-anchor="middle">NTFS-Rechte / Vererbung</text>
<text x="993" y="612" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" fill="#70501c" text-anchor="middle">Nur Lesen oder auch Schreiben?</text>
<text x="993" y="637" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="normal" fill="#70501c" text-anchor="middle">Weitere Zugriffskontrollen</text>
<path d="M207,664 V710 M600,664 V710 M993,664 V710 M207,710 H993 M600,710 V750" stroke="#4c7f92" stroke-width="2.4" fill="none"/>
<rect x="255" y="754" width="690" height="92" rx="14" fill="#eff9fb" stroke="#1e8e9e" stroke-width="1.8"/>
<text x="600" y="786" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="bold" fill="#162d40" text-anchor="middle">Ursache durch Befunde eingrenzen</text>
<text x="600" y="815" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="normal" fill="#162d40" text-anchor="middle">Nur gezielt und autorisiert ändern – keine Rechte pauschal erweitern</text>
<path d="M600,846 L600,885" stroke="#4c7f92" stroke-width="2.5" fill="none" marker-end="url(#arr)" />
<rect x="255" y="890" width="690" height="90" rx="14" fill="#e4f7e9" stroke="#34966b" stroke-width="1.8"/>
<text x="600" y="925" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="bold" fill="#185b3b" text-anchor="middle">Erfolgskontrolle mit dem Benutzer</text>
<text x="600" y="956" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="normal" fill="#162d40" text-anchor="middle">Z: korrekt? UNC nutzbar? Benötigte Dateioperation möglich?</text>
<rect x="40" y="1016" width="1120" height="53" rx="14" fill="#fff7dc" stroke="#e8bc37" stroke-width="1.8"/>
<text x="600" y="1049" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="bold" fill="#665218" text-anchor="middle">Merksatz: Laufwerksbuchstabe ≠ Netzwerkfreigabe ≠ Berechtigung</text>
</svg>