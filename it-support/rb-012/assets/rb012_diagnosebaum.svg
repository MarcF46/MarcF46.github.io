<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1880" role="img" aria-labelledby="title desc">
<title id="title">RB-012: MFA funktioniert nicht – Diagnose-Entscheidungsbaum</title>
<desc id="desc">Von der Prüfung des eigenen Anmeldeversuchs über Kennwort, MFA-Verfügbarkeit, App, Entra-Protokoll und Conditional Access bis zur Funktionsprüfung. Jede Fehlentscheidung führt zur passenden sicherheitsorientierten Maßnahme.</desc>
