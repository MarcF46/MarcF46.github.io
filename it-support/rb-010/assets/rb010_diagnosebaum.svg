<text x="600" y="75" font-family="DejaVu Sans, Arial" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle">RB-010 · Diagnose-Entscheidungsbaum</text>
<text x="600" y="112" font-family="DejaVu Sans, Arial" font-size="22" font-weight="normal" fill="#83e5dd" text-anchor="middle">Keine Netzwerk- oder Internetverbindung</text>
<rect x="65" y="160" width="495" height="68" rx="13" fill="#d5f7ed" stroke="#48a88f" stroke-width="2"/>
<text x="315" y="188" font-family="DejaVu Sans, Arial" font-size="17" font-weight="bold" fill="#176451" text-anchor="middle">JA → Weiter zum nächsten Prüfschritt</text>
<text x="315" y="211" font-family="DejaVu Sans, Arial" font-size="15" font-weight="normal" fill="#176451" text-anchor="middle">Solange die jeweilige Ebene funktioniert</text>
<rect x="660" y="160" width="474" height="68" rx="13" fill="#fff1d7" stroke="#c9a04f" stroke-width="2"/>
<text x="897" y="187" font-family="DejaVu Sans, Arial" font-size="17" font-weight="bold" fill="#8a5d22" text-anchor="middle">NEIN → Diesen Fehlerzweig untersuchen</text>
<text x="897" y="211" font-family="DejaVu Sans, Arial" font-size="15" font-weight="normal" fill="#8a5d22" text-anchor="middle">Erst Befund, dann gezielte Änderung</text>
