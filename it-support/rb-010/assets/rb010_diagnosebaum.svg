<text x="686" y="514" font-family="DejaVu Sans, Arial" font-size="18" font-weight="bold" fill="#975d1d">Adapter getrennt oder inaktiv</text>
<text x="686" y="553" font-family="DejaVu Sans, Arial" font-size="16" font-weight="normal" fill="#4d5863">Kabel, Switchport, Funk und Treiber prüfen</text>
<text x="686" y="586" font-family="DejaVu Sans, Arial" font-size="14" font-weight="normal" fill="#64747e">L1 prüfen · bei Bedarf L2 eskalieren</text>
