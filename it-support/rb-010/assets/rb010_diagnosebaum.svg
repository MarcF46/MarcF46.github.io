<text x="106" y="297" font-family="DejaVu Sans, Arial" font-size="21" font-weight="bold" fill="white" text-anchor="middle">1</text>
<text x="149" y="299" font-family="DejaVu Sans, Arial" font-size="22" font-weight="bold" fill="#153e57">Fehlerbild eingrenzen</text>
<text x="95" y="347" font-family="DejaVu Sans, Arial" font-size="16" font-weight="normal" fill="#405766">Ein PC, mehrere Benutzer oder nur ein Dienst?</text>
<text x="95" y="375" font-family="DejaVu Sans, Arial" font-size="14" font-weight="normal" fill="#617b88">Diagnose möglichst zunächst lesend</text>
<rect x="660" y="255" width="474" height="145" rx="18" fill="#fff9ef" stroke="#d6aa64" stroke-width="2.5" filter="url(#shadow)"/>
<text x="686" y="296" font-family="DejaVu Sans, Arial" font-size="18" font-weight="bold" fill="#975d1d">Mehrere Nutzer / Standort betroffen</text>
<text x="686" y="335" font-family="DejaVu Sans, Arial" font-size="16" font-weight="normal" fill="#4d5863">Gemeinsame Infrastruktur priorisiert untersuchen</text>
<text x="686" y="368" font-family="DejaVu Sans, Arial" font-size="14" font-weight="normal" fill="#64747e">L1 prüfen · bei Bedarf L2 eskalieren</text>
