<text x="106" y="515" font-family="DejaVu Sans, Arial" font-size="21" font-weight="bold" fill="white" text-anchor="middle">2</text>
<text x="149" y="517" font-family="DejaVu Sans, Arial" font-size="22" font-weight="bold" fill="#153e57">Netzwerkadapter prüfen</text>
<text x="95" y="565" font-family="DejaVu Sans, Arial" font-size="16" font-weight="normal" fill="#405766">Kabel/WLAN, Status, Link, Treiber</text>
<text x="95" y="593" font-family="DejaVu Sans, Arial" font-size="14" font-weight="normal" fill="#617b88">Diagnose möglichst zunächst lesend</text>
