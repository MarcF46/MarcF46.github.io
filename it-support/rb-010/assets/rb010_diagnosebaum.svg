<text x="149" y="953" font-family="DejaVu Sans, Arial" font-size="22" font-weight="bold" fill="#153e57">Gateway und Route prüfen</text>
<text x="95" y="1001" font-family="DejaVu Sans, Arial" font-size="16" font-weight="normal" fill="#405766">Gibt es einen sinnvollen Weg zum Ziel?</text>
<text x="95" y="1029" font-family="DejaVu Sans, Arial" font-size="14" font-weight="normal" fill="#617b88">Diagnose möglichst zunächst lesend</text>
<rect x="660" y="909" width="474" height="145" rx="18" fill="#fff9ef" stroke="#d6aa64" stroke-width="2.5" filter="url(#shadow)"/>
<text x="686" y="950" font-family="DejaVu Sans, Arial" font-size="18" font-weight="bold" fill="#975d1d">Route oder Gateway auffällig</text>
<text x="686" y="989" font-family="DejaVu Sans, Arial" font-size="16" font-weight="normal" fill="#4d5863">Subnetz, VPN, Routenauswahl kontrollieren</text>
<text x="686" y="1022" font-family="DejaVu Sans, Arial" font-size="14" font-weight="normal" fill="#64747e">L1 prüfen · bei Bedarf L2 eskalieren</text>
<line x1="561" y1="982" x2="648" y2="982" stroke="#c5934a" stroke-width="4"/>
<polygon points="648,982 632,973 632,991" fill="#c5934a"/>
<line x1="315" y1="1055" x2="315" y2="1113" stroke="#2f9f8d" stroke-width="4"/>
<polygon points="315,1123 305,1107 325,1107" fill="#2f9f8d"/>
<rect x="65" y="1127" width="495" height="145" rx="18" fill="#ffffff" stroke="#319da0" stroke-width="3" filter="url(#shadow)"/>
<circle cx="106" cy="1162" r="25" fill="#0e6986"/>
<text x="106" y="1169" font-family="DejaVu Sans, Arial" font-size="21" font-weight="bold" fill="white" text-anchor="middle">5</text>
<text x="149" y="1171" font-family="DejaVu Sans, Arial" font-size="22" font-weight="bold" fill="#153e57">DNS-Auflösung prüfen</text>
<text x="95" y="1219" font-family="DejaVu Sans, Arial" font-size="16" font-weight="normal" fill="#405766">Wird der gewünschte Hostname richtig aufgelöst?</text>
<text x="95" y="1247" font-family="DejaVu Sans, Arial" font-size="14" font-weight="normal" fill="#617b88">Diagnose möglichst zunächst lesend</text>
<rect x="660" y="1127" width="474" height="145" rx="18" fill="#fff9ef" stroke="#d6aa64" stroke-width="2.5" filter="url(#shadow)"/>
<text x="686" y="1168" font-family="DejaVu Sans, Arial" font-size="18" font-weight="bold" fill="#975d1d">Name nicht auflösbar</text>
<text x="686" y="1207" font-family="DejaVu Sans, Arial" font-size="16" font-weight="normal" fill="#4d5863">Soll-DNS, Zone und Erreichbarkeit prüfen</text>
<text x="686" y="1240" font-family="DejaVu Sans, Arial" font-size="14" font-weight="normal" fill="#64747e">L1 prüfen · bei Bedarf L2 eskalieren</text>
