<text x="686" y="732" font-family="DejaVu Sans, Arial" font-size="18" font-weight="bold" fill="#975d1d">IP fehlt oder 169.254.x.x</text>
<text x="686" y="771" font-family="DejaVu Sans, Arial" font-size="16" font-weight="normal" fill="#4d5863">DHCP-Client, VLAN, Relay und Server prüfen</text>
<text x="686" y="804" font-family="DejaVu Sans, Arial" font-size="14" font-weight="normal" fill="#64747e">L1 prüfen · bei Bedarf L2 eskalieren</text>
