<rect x="65" y="691" width="495" height="145" rx="18" fill="#ffffff" stroke="#319da0" stroke-width="3" filter="url(#shadow)"/>
<circle cx="106" cy="726" r="25" fill="#0e6986"/>
<text x="106" y="733" font-family="DejaVu Sans, Arial" font-size="21" font-weight="bold" fill="white" text-anchor="middle">3</text>
<text x="149" y="735" font-family="DejaVu Sans, Arial" font-size="22" font-weight="bold" fill="#153e57">IP-Konfiguration prüfen</text>
<text x="95" y="783" font-family="DejaVu Sans, Arial" font-size="16" font-weight="normal" fill="#405766">Adresse, Präfix, DHCP, Gateway, DNS</text>
<text x="95" y="811" font-family="DejaVu Sans, Arial" font-size="14" font-weight="normal" fill="#617b88">Diagnose möglichst zunächst lesend</text>
