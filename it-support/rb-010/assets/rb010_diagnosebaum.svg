<circle cx="106" cy="1380" r="25" fill="#0e6986"/>
<text x="106" y="1387" font-family="DejaVu Sans, Arial" font-size="21" font-weight="bold" fill="white" text-anchor="middle">6</text>
<text x="149" y="1389" font-family="DejaVu Sans, Arial" font-size="22" font-weight="bold" fill="#153e57">Zieldienst gezielt testen</text>
<text x="95" y="1437" font-family="DejaVu Sans, Arial" font-size="16" font-weight="normal" fill="#405766">TCP-Port und echte Anwendung prüfen</text>
<text x="95" y="1465" font-family="DejaVu Sans, Arial" font-size="14" font-weight="normal" fill="#617b88">Diagnose möglichst zunächst lesend</text>
<rect x="660" y="1345" width="474" height="145" rx="18" fill="#fff9ef" stroke="#d6aa64" stroke-width="2.5" filter="url(#shadow)"/>
<text x="686" y="1386" font-family="DejaVu Sans, Arial" font-size="18" font-weight="bold" fill="#975d1d">Port oder Anwendung funktioniert nicht</text>
<text x="686" y="1425" font-family="DejaVu Sans, Arial" font-size="16" font-weight="normal" fill="#4d5863">Zieldienst, Firewall, Proxy, Route prüfen</text>
<text x="686" y="1458" font-family="DejaVu Sans, Arial" font-size="14" font-weight="normal" fill="#64747e">L1 prüfen · bei Bedarf L2 eskalieren</text>
<line x1="561" y1="1418" x2="648" y2="1418" stroke="#c5934a" stroke-width="4"/>
<polygon points="648,1418 632,1409 632,1427" fill="#c5934a"/>
<line x1="315" y1="1490" x2="315" y2="1522" stroke="#2f9f8d" stroke-width="4"/>
<polygon points="315,1535 305,1517 325,1517" fill="#2f9f8d"/>
<rect x="65" y="1538" width="1069" height="70" rx="16" fill="#c9f3df" stroke="#47a078" stroke-width="2"/>
<text x="600" y="1565" font-family="DejaVu Sans, Arial" font-size="20" font-weight="bold" fill="#1a674f" text-anchor="middle">Ursache beheben → echte Anwendung testen → Ticket dokumentieren</text>
<text x="600" y="1593" font-family="DejaVu Sans, Arial" font-size="16" font-weight="normal" fill="#346e60" text-anchor="middle">Bei Mehrbenutzerstörungen können zentrale Infrastrukturprüfungen parallel erfolgen.</text>
<rect x="65" y="1624" width="1069" height="57" rx="14" fill="#fff0d8"/>
<text x="600" y="1648" font-family="DejaVu Sans, Arial" font-size="16" font-weight="bold" fill="#8d631f" text-anchor="middle">Achtung: Ping-Fehler ≠ Totalausfall · „Kein Internet“ ≠ Beweis</text>
<text x="600" y="1670" font-family="DejaVu Sans, Arial" font-size="15" font-weight="normal" fill="#8d631f" text-anchor="middle">Kein vorschneller Netzwerkreset, keine pauschale Firewall- oder DNS-Änderung.</text>
</svg>