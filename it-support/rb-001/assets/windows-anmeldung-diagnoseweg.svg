<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="520" viewBox="0 0 1250 520" role="img" aria-labelledby="title desc">
<title id="title">Einfacher Diagnoseweg bei fehlgeschlagener Windows-Anmeldung</title><desc id="desc">Die Anmeldung wird nach Kontotyp in vier Zweige aufgeteilt, um zuerst passende Konten- und Geräteprüfungen zu wählen.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#e8f3ff"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a5aa7"/><stop offset="1" stop-color="#167fd4"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#126bb4"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18324f}.heading{font-weight:700;font-size:29px}.sub{font-size:17px;fill:#536b82}.cardtitle{font-weight:700;font-size:22px}.detail{font-size:18px}.small{font-size:16px}.light{fill:#fff}.box{fill:#fff;stroke:#b6d4ed;stroke-width:2}.arrow{stroke:#126bb4;stroke-width:4;fill:none;marker-end:url(#arrow)}.pill{fill:#e5f3ff;stroke:#bedbf2;stroke-width:1.5}.note{fill:#edf8f0;stroke:#9fd3ad;stroke-width:1.5}</style></defs><rect x="1" y="1" width="1248" height="518" rx="25" fill="url(#bg)" stroke="#afcfe9"/><text x="37" y="50" class="heading">Windows-Anmeldung: Wo beginne ich die Fehlersuche?</text><text x="37" y="80" class="sub">Erst die Anmeldeart klären – dann gezielt weiterprüfen.</text>
<rect x="415" y="106" width="420" height="66" rx="15" fill="#fff0ee" stroke="#e89e91" stroke-width="2"/><text x="625" y="146" class="cardtitle" text-anchor="middle">Anmeldung schlägt fehl</text>
<path class="arrow" d="M625 173V214"/><rect x="465" y="218" width="320" height="54" rx="15" fill="url(#blue)"/><text x="625" y="252" class="cardtitle light" text-anchor="middle">Welche Anmeldeart?</text>
<path d="M625 272V304M173 304H1073" stroke="#126bb4" stroke-width="4" fill="none"/>
<path class="arrow" d="M173 304V333"/><path class="arrow" d="M473 304V333"/><path class="arrow" d="M773 304V333"/><path class="arrow" d="M1073 304V333"/>
<rect class="box" x="32" y="340" width="280" height="111" rx="17"/><text x="172" y="371" class="cardtitle" text-anchor="middle">AD-Domäne</text><text x="172" y="398" class="small" text-anchor="middle">Konto, Sperre, DNS,</text><text x="172" y="421" class="small" text-anchor="middle">DC und VPN prüfen</text>
<rect class="box" x="332" y="340" width="280" height="111" rx="17"/><text x="472" y="371" class="cardtitle" text-anchor="middle">Microsoft Entra</text><text x="472" y="398" class="small" text-anchor="middle">Anmeldeprotokolle,</text><text x="472" y="421" class="small" text-anchor="middle">Gerätestatus prüfen</text>
<rect class="box" x="632" y="340" width="280" height="111" rx="17"/><text x="772" y="371" class="cardtitle" text-anchor="middle">Windows Hello</text><text x="772" y="398" class="small" text-anchor="middle">PIN und zulässige</text><text x="772" y="421" class="small" text-anchor="middle">Anmeldeoptionen prüfen</text>
<rect class="box" x="932" y="340" width="280" height="111" rx="17"/><text x="1072" y="371" class="cardtitle" text-anchor="middle">Lokales Konto</text><text x="1072" y="398" class="small" text-anchor="middle">Lokalen Kontostatus</text><text x="1072" y="421" class="small" text-anchor="middle">und Kennwort prüfen</text>
<rect class="note" x="225" y="470" width="800" height="38" rx="11"/><text x="625" y="495" class="detail" text-anchor="middle">Ursache eingrenzen → gezielt beheben → Anmeldung testen</text></svg>