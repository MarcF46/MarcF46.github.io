<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="530" viewBox="0 0 1240 530" role="img" aria-labelledby="title desc">
<title id="title">Fernsupport: Bildschirmfreigabe, RDP und PowerShell-Remoting</title><desc id="desc">Die Grafik vergleicht die aktive gemeinsame Bildschirmansicht mit einer separaten RDP-Sitzung und mit PowerShell-Remoting ohne Desktop-Oberfläche.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#e8f3ff"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a5aa7"/><stop offset="1" stop-color="#167fd4"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#126bb4"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18324f}.heading{font-weight:700;font-size:29px}.sub{font-size:17px;fill:#536b82}.cardtitle{font-weight:700;font-size:22px}.detail{font-size:18px}.small{font-size:16px}.light{fill:#fff}.box{fill:#fff;stroke:#b6d4ed;stroke-width:2}.arrow{stroke:#126bb4;stroke-width:4;fill:none;marker-end:url(#arrow)}.pill{fill:#e5f3ff;stroke:#bedbf2;stroke-width:1.5}.note{fill:#edf8f0;stroke:#9fd3ad;stroke-width:1.5}</style></defs><rect x="1" y="1" width="1238" height="528" rx="25" fill="url(#bg)" stroke="#afcfe9"/><text x="40" y="55" class="heading">Drei Wege für den direkten Fernsupport</text><text x="40" y="86" class="sub">Die passende Methode hängt davon ab, was geprüft oder am Arbeitsplatz gezeigt werden soll.</text>
<rect class="box" x="34" y="122" width="368" height="322" rx="19"/><rect x="49" y="135" width="337" height="49" rx="12" fill="#dcefff"/><text x="217" y="166" class="cardtitle" text-anchor="middle">Bildschirmfreigabe</text>
<rect x="82" y="217" width="102" height="74" rx="9" stroke="#3179b0" stroke-width="4" fill="#c9e5fd"/><rect x="252" y="217" width="102" height="74" rx="9" stroke="#3179b0" stroke-width="4" fill="#c9e5fd"/><path d="M184 253H252" stroke="#1581c4" stroke-width="4" stroke-dasharray="8 7"/><text x="133" y="311" class="small" text-anchor="middle">Mitarbeiter</text><text x="303" y="311" class="small" text-anchor="middle">Support</text><text x="215" y="362" class="detail" text-anchor="middle">Beide sehen dieselbe</text><text x="215" y="389" class="detail" text-anchor="middle">Windows-Sitzung.</text><text x="215" y="423" class="small" text-anchor="middle">Beispiel: Schnellhilfe, Teams</text>
<rect class="box" x="436" y="122" width="368" height="322" rx="19"/><rect x="451" y="135" width="337" height="49" rx="12" fill="#dcefff"/><text x="620" y="166" class="cardtitle" text-anchor="middle">Remotedesktop (RDP)</text>
<rect x="493" y="217" width="100" height="74" rx="9" stroke="#3179b0" stroke-width="4" fill="#c9e5fd"/><path class="arrow" d="M602 254H667"/><rect x="672" y="217" width="100" height="74" rx="9" stroke="#3179b0" stroke-width="4" fill="#e6f1fb"/><text x="544" y="311" class="small" text-anchor="middle">Support</text><text x="723" y="311" class="small" text-anchor="middle">Ziel-PC</text><text x="620" y="362" class="detail" text-anchor="middle">Fernanmeldung am Ziel-PC;</text><text x="620" y="389" class="detail" text-anchor="middle">lokale Sitzung meist gesperrt</text><text x="620" y="415" class="small" text-anchor="middle">oder getrennt.</text>
<rect class="box" x="838" y="122" width="368" height="322" rx="19"/><rect x="853" y="135" width="337" height="49" rx="12" fill="#dcefff"/><text x="1022" y="166" class="cardtitle" text-anchor="middle">PowerShell-Remoting</text>
<rect x="914" y="210" width="215" height="101" rx="10" fill="#15365b"/><text x="930" y="242" class="cardtitle light">&gt;_</text><text x="932" y="275" class="small light">Get-Service</text><text x="932" y="297" class="small light">Invoke-Command</text><text x="1020" y="360" class="detail" text-anchor="middle">Befehle statt Desktopansicht</text><text x="1020" y="389" class="detail" text-anchor="middle">für Diagnose und Verwaltung.</text><text x="1020" y="423" class="small" text-anchor="middle">Voraussetzung: Freigaben / Rechte</text>
<rect class="pill" x="35" y="467" width="1170" height="41" rx="11"/><text x="620" y="495" class="detail" text-anchor="middle">Zentrale Kontoverwaltung (RSAT / AD) ist ein weiterer Weg – ganz ohne Sitzung am Benutzer-PC.</text></svg>