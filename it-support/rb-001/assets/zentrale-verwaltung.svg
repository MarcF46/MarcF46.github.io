<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">Zentrale Verwaltung – ohne Übernahme der Benutzersitzung</title><desc id="desc">Ein Support-Mitarbeiter prüft Active Directory über RSAT oder PowerShell; der Benutzer arbeitet an seinem eigenen PC weiter.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#e8f3ff"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a5aa7"/><stop offset="1" stop-color="#167fd4"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#126bb4"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18324f}.heading{font-weight:700;font-size:29px}.sub{font-size:17px;fill:#536b82}.cardtitle{font-weight:700;font-size:22px}.detail{font-size:18px}.small{font-size:16px}.light{fill:#fff}.box{fill:#fff;stroke:#b6d4ed;stroke-width:2}.arrow{stroke:#126bb4;stroke-width:4;fill:none;marker-end:url(#arrow)}.pill{fill:#e5f3ff;stroke:#bedbf2;stroke-width:1.5}.note{fill:#edf8f0;stroke:#9fd3ad;stroke-width:1.5}</style></defs><rect x="1" y="1" width="1198" height="438" rx="25" fill="url(#bg)" stroke="#afcfe9"/><text x="40" y="52" class="heading">Zentrale Verwaltung</text><text x="40" y="82" class="sub">Konto prüfen oder verwalten, ohne die Windows-Sitzung des Mitarbeiters zu übernehmen</text>
<rect class="box" x="35" y="121" width="320" height="240" rx="21"/><rect x="65" y="145" width="260" height="41" rx="11" fill="url(#blue)"/><text x="195" y="173" class="cardtitle light" text-anchor="middle">IT-Support</text>
