ent-Queue, Druckerobjekt, App, Treiber</text><path d="M590 575 L487 575" fill="none" stroke="#277e8c" stroke-width="3.2" marker-end="url(#arrow)"/><path d="M487 575 L487 675" fill="none" stroke="#277e8c" stroke-width="3.2" marker-end="url(#arrow)"/><rect x="280" y="680" width="405" height="103" rx="13" fill="#e5f6fb" stroke="#2c91a0" stroke-width="2.4"/><text x="482" y="709" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#122940">Ein Client betroffen</text><text x="482" y="734" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#122940">Get-Printer / Get-PrintJob</text><text x="482" y="759" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#122940">lokalen Spooler prüfen</text><path d="M837 620 L837 675" fill="none" stroke="#277e8c" stroke-width="3.2" marker-end="url(#arrow)"/><rect x="710" y="680" width="375" height="103" rx="13" fill="#fef5e4" stroke="#dba84a" stroke-width="2.4"/><text x="896" y="709" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#122940">Mehrere Benutzer betroffen</text><text x="896" y="734" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#122940">Printserver, Queue, Gerät</text><text x="896" y="759" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#122940">zentralen Dienst / Netz prüfen</text><path d="M482 783 L482 822" fill="none" stroke="#277e8c" stroke-width="3.2" marker-end="url(#arrow)"/><path d="M896 783 L896 822" fill="none" stroke="#277e8c" stroke-width="3.2" marker-end="url(#arrow)"/><rect x="280" y="825" width="405" height="106" rx="13" fill="#ffffff" stroke="#2c91a0" stroke-width="2.4"/><text x="482" y="855" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#122