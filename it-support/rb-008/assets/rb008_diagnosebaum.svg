<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1340" viewBox="0 0 1120 1340" role="img" aria-label="RB-008 – Entscheidungsbaum zur Druckerdiagnose"><rect width="1120" height="1340" fill="#f7fbfc"/><rect x="25" y="20" width="1070" height="92" rx="24" fill="#082447"/><text x="560" y="58" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="33" font-weight="bold" fill="#ffffff">RB-008 · Drucker druckt nicht</text><text x="560" y="91" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#9aeaf0">Diagnose-Entscheidungsbaum · L1 → L2</text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#277e8c" stroke-width="1.6"/></marker></defs><rect x="285" y="145" width="550" height="80" rx="13" fill="#e0f6f8" stroke="#2c91a0" stroke-width="2.4"/><text x="560" y="177" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" fill="#122940">Störung erfassen: ein Benutzer oder mehrere?</text><text x="560" y="202" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#122940">Druckername, Zeitpunkt, Fehlermeldung, Anwendung</text><path d="M560 225 L560 260" fill="none" stroke="#277e8c" stroke-width="3.2" marker-end="url(#arrow)"/><rect x="280" y="267" width="560" height="82" rx="13" fill="#fff" stroke="#2c91a0" stroke-width="2.4"/><text x="560" y="299" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" fill="#122940">Druckt der Drucker eine interne Testseite?</text><text x="560" y="324" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#122940">Gerätedisplay · Papier · Toner · Fehlercode</text><path d="M280 306 L195 306" fill="none" stroke="#277e8c" stroke-width="3.2" marker-end="url(#arrow)"/><path d="M195 306 L195 385" fill="none" stroke="#277e8c" s