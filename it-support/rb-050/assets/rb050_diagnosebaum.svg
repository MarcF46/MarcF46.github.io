l, sans-serif" font-size="18" font-weight="600" text-anchor="start" x="48" y="863">Replikationszeit prüfen.</text><line stroke="#C78D35" stroke-linecap="round" stroke-width="3" x1="435" x2="421" y1="852" y2="852" /><polygon fill="#C78D35" points="432,844 432,860 414,852" /><rect fill="#F9EBD9" height="158" rx="20" ry="20" stroke="none" stroke-width="0" width="385" x="1235" y="994" /><rect fill="#FEF3DC" height="158" rx="20" ry="20" stroke="#C78D35" stroke-width="2.3" width="385" x="1230" y="987" /><text fill="#965914" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="800" text-anchor="start" x="1250" y="1023">RESTZUGANG · Sitzungen offen</text><text fill="#132F4B" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start" x="1250" y="1064">VPN-/App-Owner: Session beenden,</text><text fill="#132F4B" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start" x="1250" y="1093">API-/Service-Zugänge prüfen.</text><line stroke="#C78D35" stroke-linecap="round" stroke-width="3" x1="1215" x2="1222" y1="1082" y2="1082" /><polygon fill="#C78D35" points="1211,1074 1211,1090 1229,1082" /><rect fill="#F9EBD9" height="158" rx="20" ry="20" stroke="none" stroke-width="0" width="385" x="33" y="1224" /><rect fill="#FEF3DC" height="158" rx="20" ry="20" stroke="#C78D35" stroke-width="2.3" width="385" x="28" y="1217" /><text fill="#965914" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="800" text-anchor="start" x="48" y="1253">DATEN · Aufbewahrung offen</text><text fill="#132F4B" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start" x="48" y="1294">Vor Wipe, Lizenzentzug und</text><text fill="#132F4B" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start" x="48" y="1323">Kontolöschung STOP.</text><line stroke="#C78D35" stroke-linecap="round" stroke-width="3" x1="435" x2="421" y1="1312" y2="1312" /><polygon fill="#C78D35" points="432,1304 432,1320 414,1312" /><rect fill="#F9EBD9" height="158" rx="20" ry="20" stroke="none" stroke-width="0" width="385" x="1235" y="1684" /><rect fill="#FEF3DC" height="158" rx="20" ry="20" stroke="#C78D35" stroke-width="2.3" width="385" x="1230" y="1677" /><text fill="#965914" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="800" text-anchor="start" x="1250" y="1713">TEILABSCHLUSS</text><text fill="#132F4B" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start" x="1250" y="1754">Sperrung erfolgt; Restaufträge</text><text fill="#132F4B" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start" x="1250" y="1783">mit Owner und Frist offen.</text><line stroke="#C78D35" stroke-linecap="round" stroke-width="3" x1="1215" x2="1222" y1="1772" y2="1772" /><polygon fill="#C78D35" points="1211,1764 1211,1780 1229,1772" /><line stroke="#187F5B" stroke-linecap="round" stroke-width="4" x1="825" x2="825" y1="1845" y2="1893" /><polygon fill="#187F5B" points="816,1882 834,1882 825,1900" /><rect fill="#E2F7E7" height="147" rx="23" ry="23" stroke="#187F5B" stroke-width="3" width="978" x="336" y="1912" /><text fill="#187F5B" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="800" text-anchor="middle" x="825.0" y="1957">SICHERER ABSCHLUSS</text><text fill="#132F4B" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="600" text-anchor="middle" x="825.0" y="1998">Sperrung und relevante App-Zugänge nachgewiesen</text><text fill="#132F4B" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="600" text-anchor="middle" x="825.0" y="2030">Daten- und Gerätefolgen dokumentiert · Restaufträge mit Owner</text><rect fill="#FFF3C3" height="135" rx="21" ry="21" stroke="#E1AD24" stroke-width="2.5" width="1592" x="29" y="2103" /><text fill="#94630D" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="800" text-anchor="start" x="59" y="2147">SICHERHEIT</text><text fill="#132F4B" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="600" text-anchor="start" x="284" y="2147">Kein ungeprüfter Geräte-Wipe, keine Geheimnisse im Ticket,</text><text fill="#132F4B" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start" x="284" y="2191">kein Lizenzentzug oder Löschen ohne Daten- und Aufbewahrungsprüfung.</text><text fill="#55718B" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle" x="825.0" y="2315">Recherchierte Diagnosevorlage · Praktische Validierung steht aus</text></svg>