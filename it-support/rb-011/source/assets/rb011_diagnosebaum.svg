<text x="168.0" y="709.0" text-anchor="middle" dominant-baseline="middle" font-size="17" font-family="DejaVu Sans,sans-serif" font-weight="normal" fill="#153049">Routingtabelle,</text>
<text x="168.0" y="739.0" text-anchor="middle" dominant-baseline="middle" font-size="17" font-family="DejaVu Sans,sans-serif" font-weight="normal" fill="#153049">Gateway, Firewall</text>
