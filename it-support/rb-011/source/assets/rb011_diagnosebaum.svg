<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1660" role="img" aria-labelledby="title desc">
<title id="title">RB-011: VPN-Verbindung schlägt fehl – Diagnose-Entscheidungsbaum</title>
<desc id="desc">Fünfstufige Diagnose. Erst Internet ohne VPN, dann Tunnelaufbau, Route, interne DNS-Auflösung und konkrete Anwendung prüfen. Bei Fehlern den passenden Zweig untersuchen.</desc>
<rect x="0" y="0" width="1200" height="1660" rx="20" fill="#eefaff"/>
<rect x="0" y="0" width="1200" height="118" rx="18" fill="#082948"/>
<text x="600" y="55" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="33" font-weight="bold" fill="#42e1da">RB-011 · VPN-Diagnose</text>
<text x="600" y="88" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#ffffff">Von der Internetverbindung bis zur Zielanwendung</text>
<rect x="345" y="160" width="510" height="100" rx="16" fill="#ffffff" stroke="#368da0" stroke-width="3"/>
<text x="600.0" y="195.0" text-anchor="middle" dominant-baseline="middle" font-size="24" font-family="DejaVu Sans,sans-serif" font-weight="bold" fill="#153049">1. Internet ohne VPN</text>
<text x="600.0" y="225.0" text-anchor="middle" dominant-baseline="middle" font-size="24" font-family="DejaVu Sans,sans-serif" font-weight="bold" fill="#153049">erreichbar?</text>
<rect x="345" y="410" width="510" height="100" rx="16" fill="#ffffff" stroke="#368da0" stroke-width="3"/>
<text x="600.0" y="445.0" text-anchor="middle" dominant-baseline="middle" font-size="24" font-family="DejaVu Sans,sans-serif" font-weight="bold" fill="#153049">2. VPN-Tunnel</text>
<text x="600.0" y="475.0" text-anchor="middle" dominant-baseline="middle" font-size="24" font-family="DejaVu Sans,sans-serif" font-weight="bold" fill="#153049">verbunden?</text>
<rect x="345" y="660" width="510" height="100" rx="16" fill="#ffffff" stroke="#368da0" stroke-width="3"/>
<text x="600.0" y="695.0" text-anchor="middle" dominant-baseline="middle" font-size="24" font-family="DejaVu Sans,sans-serif" font-weight="bold" fill="#153049">3. Firmenroute</text>
<text x="600.0" y="725.0" text-anchor="middle" dominant-baseline="middle" font-size="24" font-family="DejaVu Sans,sans-serif" font-weight="bold" fill="#153049">vorhanden?</text>
<rect x="345" y="910" width="510" height="100" rx="16" fill="#ffffff" stroke="#368da0" stroke-width="3"/>
<text x="600.0" y="945.0" text-anchor="middle" dominant-baseline="middle" font-size="24" font-family="DejaVu Sans,sans-serif" font-weight="bold" fill="#153049">4. Interner Name</text>
<text x="600.0" y="975.0" text-anchor="middle" dominant-baseline="middle" font-size="24" font-family="DejaVu Sans,sans-serif" font-weight="bold" fill="#153049">auflösbar?</text>
<rect x="345" y="1160" width="510" height="100" rx="16" fill="#ffffff" stroke="#368da0" stroke-width="3"/>
<text x="600.0" y="1195.0" text-anchor="middle" dominant-baseline="middle" font-size="24" font-family="DejaVu Sans,sans-serif" font-weight="bold" fill="#153049">5. Zielport / Anwendung</text>
<text x="600.0" y="1225.0" text-anchor="middle" dominant-baseline="middle" font-size="24" font-family="DejaVu Sans,sans-serif" font-weight="bold" fill="#153049">erreichbar?</text>
