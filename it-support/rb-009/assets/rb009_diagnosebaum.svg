<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="1440" viewBox="0 0 1140 1440" role="img" aria-label="Entscheidungsbaum RB-009 zur Diagnose von Windows-WLAN-Problemen"><rect width="1140" height="1440" fill="#f5fbfc"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9" fill="#277e8c"/></marker></defs><rect x="24" y="20" width="1092" height="102" rx="22" fill="#082447"/><text x="570" y="63" text-anchor="middle" font-size="35" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif" fill="#f5fcff">RB-009 · WLAN-Verbindung funktioniert nicht</text><text x="570" y="98" text-anchor="middle" font-size="19" font-family="DejaVu Sans,Arial,sans-serif" fill="#91ebf0">Diagnose-Entscheidungsbaum · zuerst beobachten, dann ändern</text><rect x="270" y="147" width="600" height="82" rx="13" fill="#dff6f9" stroke="#388f9b" stroke-width="2.4"/><text x="570" y="183" font-size="19" font-weight="700" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#142f47">Fehlerbild erfassen: ein oder mehrere Clients?</text><text x="570" y="209" font-size="19" font-weight="400" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#142f47">Meldung · Standort · Zeitpunkt · SSID</text><path d="M570 229 L570 272" fill="none" stroke="#277e8c" stroke-width="3.2" marker-end="url(#arrow)"/><rect x="55" y="272" width="735" height="95" rx="13" fill="#ffffff" stroke="#388f9b" stroke-width="2.4"/><text x="422" y="306" font-size="20" font-weight="700" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#142f47">WLAN-Adapter aktiviert und erkannt?</text><text x="422" y="337" font-size="20" font-weight="400" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#142f47">Geräte-Manager · Get-NetAdapter · WlanSvc</text><rect x="823" y="272" width="275" height="95" rx="13" fill="#fff4e8" stroke="#d39a57" stroke-width="2.4"/><text x="960" y="296" font-size="13.6" font-weight="700" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#142f47">NEIN → Client prüfen</text><text x="960" y="321" font-size="13.6" font-weight="400" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#142f47">Funkstatus, Treiber, Windows-Dienst</text><text x="960" y="346" font-size="13.6" font-weight="400" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#142f47">nicht vorschnell Adapter entfernen</text><path d="M790 320 L823 320" fill="none" stroke="#277e8c" stroke-width="3.2" marker-end="url(#arrow)"/><text x="449" y="407" font-size="13" font-weight="400" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" fill="#247b69">JA / weiter</text><path d="M430 367 L430 454" fill="none" stroke="#277e8c" stroke-width="3.2" marker-end="url(#arrow)"/><rect x="55" y="454" width="735" height="95" rx="13" fill="#ffffff" stroke="#388f9b" stroke-width="2.4"/><text x="422" y="488" font-size="20" font-weight="700" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#142f47">Erwartete SSID sichtbar?</text><text x="422" y="519" font-size="20" font-weight="400" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#142f47">netsh wlan show networks mode=bssid</text><rect x="823" y="454" width="275" height="95" rx="13" fill="#fff4e8" stroke="#d39a57" stroke-width="2.4"/><text x="960" y="478" font-size="13.6" font-weight="700" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#142f47">NEIN → Funknetz prüfen</text><text x="960" y="503" font-size="13.6" font-weight="400" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#142f47">Signal, Frequenz, AP/Controller</text><text x="960" y="528" font-size="13.6" font-weight="400" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#142f47">anderen Standort/Client vergleichen</text><path d="M790 502 L823 502" fill="none" stroke="#277e8c" stroke-width="3.2" marker-end="url(#arrow)"/><text x="449" y="589" font-size="13" font-weight="400" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" fill="#247b69">JA / weiter</text><path d="M430 549 L430 636" fill="none" stroke="#277e8c" stroke-width="3.2" marker-end="url(#arrow)"/><rect x="55" y="636" width="735" height="95" rx="13" fill="#ffffff" stroke="#388f9b" stroke-width="2.4"/><text x="422" y="670" font-size="20" font-weight="700" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#142f47">802.1X-/WLAN-Anmeldung erfolgreich?</text><text x="422" y="701" font-size="20" font-weight="400" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#142f47">WLAN-AutoConfig · WLAN-Bericht · NPS</text><rect x="823" y="636" width="275" height="95" rx="13" fill="#fff4e8" stroke="#d39a57" stroke-width="2.4"/><text x="960" y="660" font-size="13.6" font-weight="700" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#142f47">NEIN → Authentifizierung prüfen</text><text x="960" y="685" font-size="13.6" font-weight="400" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#142f47">Profil, EAP, Zertifikat, Richtlinie</text><text x="960" y="710" font-size="13.6" font-weight="400" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#142f47">niemals Zertifikatsprüfung umgehen</text><path d="M790 684 L823 684" fill="none" stroke="#277e8c" stroke-width="3.2" marker-end="url(#arrow)"/><text x="449" y="771" font-size="13" font-weight="400" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" fill="#247b69">JA / weiter</text><path d="M430 731 L430 818" fill="none" stroke="#277e8c" stroke-width="3.2" marker-end="url(#arrow)"/><rect x="55" y="818" width="735" height="95" rx="13" fill="#ffffff" stroke="#388f9b" stroke-width="2.4"/><text x="422" y="852" font-size="20" font-weight="700" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#142f47">IP-Adresse und DHCP-Zuweisung plausibel?</text><text x="422" y="883" font-size="20" font-weight="400" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#142f47">ipconfig /all · Get-NetIPConfiguration</text><rect x="823" y="818" width="275" height="95" rx="13" fill="#fff4e8" stroke="#d39a57" stroke-width="2.4"/><text x="960" y="842" font-size="13.6" font-weight="700" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#142f47">NEIN → IP-Pfad prüfen</text><text x="960" y="867" font-size="13.6" font-weight="400" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#142f47">DHCP, VLAN, AP-Uplink</text><text x="960" y="892" font-size="13.6" font-weight="400" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#142f47">bei 169.254.x.x DHCP untersuchen</text><path d="M790 866 L823 866" fill="none" stroke="#277e8c" stroke-width="3.2" marker-end="url(#arrow)"/><text x="449" y="953" font-size="13" font-weight="400" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif" fill="#247b69">JA / weiter</text><path d="M430 913 L430 1000" fill="none" stroke="#277e8c" stroke-width="3.2" marker-end="url(#arrow)"/><rect x="55" y="1000" width="735" height="95" rx="13" fill="#ffffff" stroke="#388f9b" stroke-width="2.4"/><text x="422" y="1034" font-size="20" font-weight="700" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#142f47">DNS und benötigter Zieldienst erreichbar?</text><text x="422" y="1065" font-size="20" font-weight="400" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#142f47">Resolve-DnsName · Test-NetConnection</text><rect x="823" y="1000" width="275" height="95" rx="13" fill="#fff4e8" stroke="#d39a57" stroke-width="2.4"/><text x="960" y="1024" font-size="13.6" font-weight="700" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#142f47">NEIN → Netzdienste prüfen</text><text x="960" y="1049" font-size="13.6" font-weight="400" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#142f47">Gateway, DNS, Routing, Firewall</text><text x="960" y="1074" font-size="13.6" font-weight="400" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#142f47">Zielsystem / VPN / Proxy</text><path d="M790 1048 L823 1048" fill="none" stroke="#277e8c" stroke-width="3.2" marker-end="url(#arrow)"/><path d="M430 1095 L430 1165" fill="none" stroke="#277e8c" stroke-width="3.2" marker-end="url(#arrow)"/><rect x="80" y="1165" width="870" height="112" rx="13" fill="#e5f8e9" stroke="#5aa878" stroke-width="2.4"/><text x="515" y="1202" font-size="19" font-weight="700" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#142f47">Ursache gezielt beheben und erneut testen</text><text x="515" y="1229" font-size="19" font-weight="400" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#142f47">SSID und IP prüfen · gewünschten Dienst testen</text><text x="515" y="1256" font-size="19" font-weight="400" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#142f47">Verbindung beobachten · Ticket dokumentieren oder eskalieren</text><rect x="34" y="1310" width="1070" height="92" rx="13" fill="#fff1d9" stroke="#d7aa51" stroke-width="2.4"/><text x="570" y="1342" font-size="19" font-weight="700" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#142f47">Sicherheitsregel: Keine Profile, Treiber oder Zertifikatsprüfungen</text><text x="570" y="1371" font-size="19" font-weight="400" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" fill="#142f47">vorschnell löschen, deaktivieren oder zurücksetzen!</text></svg>