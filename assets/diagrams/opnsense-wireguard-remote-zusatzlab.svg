<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1690 1100" width="1690" height="1100" role="img" aria-labelledby="wgtitle wgdesc">
<title id="wgtitle">Optionales WireGuard-Zusatzlab: interne Simulation und externer Smartphone-Zugang zur OPNsense-Firewall</title>
<desc id="wgdesc">Dreiteiliges symmetrisches Architekturdiagramm: links die beiden Lernstufen, mit einer internen Test-VM und einem Smartphone über das Mobilfunknetz; zentral der Netzwerkpfad über Mobilfunkanbieter und Internet, physische FRITZ!Box, optionales NAT, Hyper-V und eine OPNsense-VM als WireGuard-Endpunkt, danach ausschließlich freigegebene Management-Zugriffe; rechts Sicherheit und typische Enterprise-Erweiterungen wie Multi-Faktor-Anmeldung am Managementsystem, Jump-Host, getrenntes VPN-Gateway, Change-Freigabe und Rückfallplan. Kein direkt erreichbares WebGUI über Internet.</desc>
