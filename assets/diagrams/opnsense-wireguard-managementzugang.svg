<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1740 1080" width="1740" height="1080" role="img" aria-labelledby="title desc">
<title id="title">WireGuard und sichere Remote-Administration im OPNsense-Zusatzlab</title>
<desc id="desc">Symmetrisches Netzwerkdiagramm mit drei oben bündigen Feldern: Links Lernstufen mit virtueller Admin-Workstation als Simulation, in der Mitte WireGuard-Tunnel von einem isolierten WAN-Testnetz zur OPNsense-VM und einem geschützten Managementnetz mit Jump-Host und Firewall-Weboberfläche, rechts Sicherheitsprinzipien von CISA und BSI. Eine externe Smartphone-Verbindung ist nur ein optionaler Erreichbarkeitstest; reale Out-of-Band-Isolation und vollwertiges Unternehmens-PAM werden nicht aufgebaut.</desc>
