<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 940" width="1600" height="940" role="img" aria-labelledby="title desc">
<title id="title">Geplante Architektur des OPNsense-Firewall-Labs</title>
<desc id="desc">Schematische Netzwerkarchitektur: zentraler Windows-Hyper-V-Host mit Visual Studio Code und PowerShell für Remote-Administration per SSH und WebGUI. Eine OPNsense-VM verbindet über virtuelle Switches das WAN mit getrennten Management-, Benutzer- und Servernetzen. Zabbix dient der Überwachung; WireGuard ermöglicht geplanten VPN-Zugriff.</desc>
