name: Responsive QA (temporary)
on:
  push:
    branches:
      - qa/responsive-20261109
permissions:
  contents: read
jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright test runtime
        run: npm install --no-save playwright@1.56.1
      - name: Start local site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/portfolio-site.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8765/index.html > /dev/null
      - name: Audit mobile, tablet and desktop viewports
        run: node responsive-qa/audit.mjs
      - name: Upload screenshots and findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-responsive-audit
          path: |
            responsive-qa/screenshots
            responsive-qa/report.json
          if-no-files-found: warn
